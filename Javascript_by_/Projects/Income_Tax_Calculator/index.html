<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Income-Tax-Calculator</title>
    <script src="scripts.js" defer></script>
</head>
<body style="background-color: black;color: white; display: flex; justify-content: center; align-items: center; height: 100vh;">

    <div id="parent">
        <h1>Income Tax Calculator</h1>
        <form>
            <label for="income">Annual taxable income (₹)</label>
            <input type="number" id="income" name="income" min="0" step="1" required>
            <br>

            <button type="submit">Calculate</button>
        </form>
        <br>
        <h2 id="result" aria-live="polite">Income tax: Enter your taxable income.</h2>
        <p>India FY 2025–26 new tax regime estimate. Excludes surcharge; enter taxable income after deductions.</p>
    </div>
</body>
</html>
