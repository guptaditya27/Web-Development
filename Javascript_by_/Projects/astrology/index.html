<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroGuruji</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-card">
            <h1>AstroGuruJi</h1>
            <p class="subtitle">Discover insights based on Your birth details</p>
            <form id="astroForm">
                <div class="input-group">
                    <label for="name">First Name</label>
                    <input type="text" id="name" placeholder="Enter First Name" required>
                </div>

                <div class="input-group">
                    <label for="surname">Surname</label>
                    <input type="text" id="surname" placeholder="Enter surname" required>
                </div>

                <div class="input-group">
                    <label for="birthPlace">Place of Birth</label>
                    <input type="text" id="birthPlace" placeholder="Enter birth place" required>
                </div>
                <div class="dob-container">
                    <div class="input-group">
                        <label for="day">DAY</label>
                        <input type="number" id="day" min="1" max="31" placeholder="DD"
                        required>
                    </div>
                
                    <div class="input-group">
                        <label for="month">Month</label>
                        <input type="number" id="month" min="1" max="12" placeholder="MM" required>
                    </div>

                    <div class="input-group">
                        <label for="year">Year</label>
                        <input type="number" id="year" min="1900" placeholder="YYYY" required>
                    </div>
                </div>

                <button type="submit" class="btn"> Pooch Bachha</button>

            </form>
            <div id="result" class="result-box" aria-live="polite">Your astrology insights will appear here.</div>

        </div>
    </div>
    <script src="first.js"></script>
</body>
</html>
